name: Arm64 CI/CD

on:
  workflow_dispatch:

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Use Node.js 24.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Install and Build
        shell: bash
        run: |
          npm ci
          ./scripts/check_git_status.sh
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Lint
        run: |
          npm run lint

  build:
    name: Build and Test (${{ matrix.os }}, node-${{ matrix.node }})

    strategy:
      fail-fast: false
      matrix:
        os: [windows-11-arm, ubuntu-22.04-arm]
        node: [24.x, 26.x]

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install dependency packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxkbfile-dev
          # Install native ARM64 Chromium and necessary UI dependencies
          sudo apt-get install -y chromium-browser libgbm-dev

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{ matrix.node }}
          registry-url: 'https://registry.npmjs.org'

      - name: Use Python 3.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      # GCC before 13 (ubuntu-22.04 ships 11 and 12) cannot compile the V8 headers of Electron 44
      - name: Use Clang on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "CC=clang-15" >> "$GITHUB_ENV"
          echo "CXX=clang++-15" >> "$GITHUB_ENV"

      - name: Install dependencies and Run Scripts (Linux)
        if: runner.os == 'Linux'
        run: |
          npm ci
        env:
          # Tells Puppeteer not to download its broken default binary
          PUPPETEER_SKIP_DOWNLOAD: "true"
          # Points Puppeteer directly to the runner's native binary
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"

      - name: Install dependencies and Run Scripts (Windows)
        if: runner.os == 'Windows'
        run: |
          npm ci

      - name: Build
        shell: bash
        run: |
          #npm ci
          npm run build
          git status
          ./scripts/check_git_status.sh
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Download Plugins
        shell: bash
        run: |
          npm run download:plugins -- --rate-limit 3
          
      - name: Test (headless)
        if: matrix.tests != 'skip'
        shell: bash
        run: |
          npm run rebuild:browser
          npm run test:theia

      - name: Test (browser, Windows)
        if: runner.os == 'Windows'
        run: |
          npm run test:browser

      - name: Test (browser, Linux)
        if: runner.os == 'Linux'
        run: |
          npx @puppeteer/browsers list
          npm run test:browser
        env:
          # Tells Puppeteer not to download its broken default binary
          PUPPETEER_SKIP_DOWNLOAD: "true"
          # Points Puppeteer directly to the runner's native binary
          PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"

      - name: Test (electron, Linux)
        if: runner.os == 'Linux'
        run: |
          #sudo chown root:root /home/runner/work/theia/theia/node_modules/electron/dist/chrome-sandbox
          #sudo chmod 4755 /home/runner/work/theia/theia/node_modules/electron/dist/chrome-sandbox
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm run test:electron

      - name: Zip the native dependencies' files
        run: |
          npm run zip:native:dependencies

      - name: Upload native dependencies' zip file
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: native-dependencies-${{ runner.os }}-${{ runner.arch }}-node-${{ matrix.node }}
          path: |
            scripts/*.zip
          compression-level: 0 # no compression

